<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a password</title>
    <!-- Render-blocking on purpose. Imported from JS the stylesheet was
         injected only after the entry module and its whole import graph had
         loaded, so every page painted unstyled for as long as that took. A
         link in the head is fetched in parallel with the script and blocks
         the first paint until it lands. Vite serves it compiled in dev and
         emits one hashed, shared asset in the build. -->
    <link rel="stylesheet" href="/src/styles/globals.css" />
  </head>
  <body>
    <main class="auth">
      <aside class="auth-art" aria-hidden="true">
        <div class="auth-brand"><span class="brand-mark">z</span>Zenoeats</div>
        <div>
          <div class="cloche ml-10 mt-10 scale-150"><span class="cloche-plate"></span><span class="cloche-dome"></span><span class="cloche-knob"></span></div>
          <p class="auth-art-caption">A little order.<br />A better service.</p>
        </div>
        <p class="text-caption text-muted">The care behind every order.</p>
      </aside>

      <section class="auth-form">
        <div class="auth-brand"><span class="brand-mark" aria-hidden="true">z</span>Zenoeats</div>
        <h1 id="heading">Choose a password</h1>
        <p id="intro" class="auth-intro">
          Your account was created with a temporary password. Pick your own to
          continue — nobody at Zenoeats will know it.
        </p>

        <form id="change-form" class="auth-stack" novalidate>
          <label class="block">
            <span id="current-label" class="label">Temporary password</span>
            <input
              id="current"
              class="field mt-[7px]"
              type="password"
              autocomplete="current-password"
              required
              autofocus
            />
          </label>

          <label class="block">
            <span class="label">New password</span>
            <input
              id="next"
              class="field mt-[7px]"
              type="password"
              autocomplete="new-password"
              required
              aria-describedby="length-hint"
            />
            <span id="length-hint" class="mt-2 block text-caption text-muted">
              At least 12 characters.
            </span>
          </label>

          <label class="block">
            <span class="label">Confirm new password</span>
            <input
              id="confirm"
              class="field mt-[7px]"
              type="password"
              autocomplete="new-password"
              required
              aria-describedby="match-hint"
            />
            <span id="match-hint" class="mt-2 block text-caption text-danger" hidden>
              These do not match.
            </span>
          </label>

          <p id="error" class="note-error" role="alert" hidden></p>

          <button id="submit" class="btn-primary w-full" type="submit" disabled>
            Set password
          </button>
        </form>
        <!-- Voluntary mode only. A forced change offers no way into the
             portal: the account can do nothing else until it is done. -->
        <a id="back" href="/manage" class="btn-quiet mt-[17px] w-full" hidden>
          Back to the portal
        </a>
      </section>
    </main>

    <script type="module" src="/login/change-password.ts"></script>
  </body>
</html>
