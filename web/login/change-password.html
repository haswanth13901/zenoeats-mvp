<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a password</title>
    <!-- Render-blocking on purpose. Imported from JS the stylesheet was
         injected only after the entry module and its whole import graph had
         loaded, so every page painted unstyled for as long as that took. A
         link in the head is fetched in parallel with the script and blocks
         the first paint until it lands. Vite serves it compiled in dev and
         emits one hashed, shared asset in the build. -->
    <link rel="stylesheet" href="/src/styles/globals.css" />
  </head>
  <body>
    <main class="mx-auto flex min-h-dvh max-w-sm flex-col justify-center px-5">
      <h1 id="heading" class="font-display text-3xl">Choose a password</h1>
      <p id="intro" class="mt-2 text-sm text-muted">
        Your account was created with a temporary password. Pick your own to
        continue — nobody at Zenoeats will know it.
      </p>

      <form id="change-form" class="mt-8 space-y-4" novalidate>
        <label class="block">
          <span id="current-label" class="text-sm font-medium">Temporary password</span>
          <input
            id="current"
            class="field mt-2"
            type="password"
            autocomplete="current-password"
            required
            autofocus
          />
        </label>

        <label class="block">
          <span class="text-sm font-medium">New password</span>
          <input
            id="next"
            class="field mt-2"
            type="password"
            autocomplete="new-password"
            required
          />
          <span id="length-hint" class="mt-1 block text-xs text-muted">
            At least 12 characters.
          </span>
        </label>

        <label class="block">
          <span class="text-sm font-medium">Confirm new password</span>
          <input
            id="confirm"
            class="field mt-2"
            type="password"
            autocomplete="new-password"
            required
          />
          <span id="match-hint" class="mt-1 block text-xs text-brick" hidden>
            These do not match.
          </span>
        </label>

        <p
          id="error"
          class="border-l-2 border-brick bg-brick/5 px-3 py-2 text-sm text-brick"
          hidden
        ></p>

        <button id="submit" class="btn-primary w-full" type="submit" disabled>
          Set password
        </button>
      </form>
      <a id="back" href="/manage" class="btn-quiet mt-3 w-full text-center" hidden>
        Back to the portal
      </a>
    </main>

    <script type="module" src="/login/change-password.ts"></script>
  </body>
</html>
