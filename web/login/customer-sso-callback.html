<!doctype html>
<html lang="en" data-surface="customer">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing you in…</title>
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <!-- Runtime configuration (the Clerk publishable key), written by the web
         container at startup. A classic script, so it runs before the module
         entry below reads it. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <!-- A compact interstitial while Clerk finishes the provider's return and
         sends the browser on. No progress bar: there is no progress to report,
         only a wait of unknown length. -->
    <main class="mx-auto flex min-h-[75vh] max-w-[570px] flex-col items-center justify-center px-6 pb-[60px] pt-20 text-center sm:min-h-[80vh]" role="status">
      <div class="cloche mb-[22px]" aria-hidden="true"><span class="cloche-plate"></span><span class="cloche-dome"></span><span class="cloche-knob"></span></div>
      <h1 class="mb-4 flex items-center gap-4 font-display text-[35px] leading-[1.12] tracking-[-1px] sm:text-4xl">
        <span aria-hidden="true" class="inline-block h-5 w-5 animate-spin rounded-full border-2 border-muted border-r-transparent motion-reduce:animate-none"></span>
        Signing you in…
      </h1>
    </main>

    <script type="module" src="/login/customer-sso-callback.ts"></script>
  </body>
</html>
