<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an account</title>
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <!-- Runtime configuration (the Clerk publishable key), written by the web
         container at startup. A classic script, so it runs before the module
         entry below reads it. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <main class="mx-auto flex min-h-dvh max-w-sm flex-col justify-center px-5 py-10">
      <h1 class="font-display text-3xl">Create an account</h1>

      <p id="error" class="mt-6 border-l-2 border-brick bg-brick/5 px-3 py-2 text-sm text-brick" hidden></p>

      <section id="form-section">
        <p class="mt-2 text-sm text-muted">
          We&apos;ll email you a 6-digit code to confirm the address.
        </p>

        <!-- One button per social sign-in switched on in Clerk (Google, Apple,
             Facebook), rendered by customer-shared.ts. Hidden when there are none. -->
        <section id="social-section" class="mt-8" hidden>
          <div id="social-buttons" class="space-y-3"></div>
          <div class="my-6 flex items-center gap-3 text-xs text-muted">
            <span class="h-px flex-1 bg-hairline"></span>or<span class="h-px flex-1 bg-hairline"></span>
          </div>
        </section>

        <form id="sign-up-form" class="mt-6 space-y-4" novalidate>
          <label id="name-field" class="block" hidden>
            <span class="text-sm font-medium">Name <span class="font-normal text-muted">(optional)</span></span>
            <input id="full-name" class="field mt-2" type="text" autocomplete="name" maxlength="160" />
          </label>

          <label class="block">
            <span class="text-sm font-medium">Email</span>
            <input id="email" class="field mt-2" type="email" autocomplete="email" required />
          </label>

          <label class="block">
            <span class="text-sm font-medium">Password</span>
            <input id="password" class="field mt-2" type="password" autocomplete="new-password" required />
            <span id="length-hint" class="mt-1 block text-xs text-muted"></span>
          </label>

          <label class="block">
            <span class="text-sm font-medium">Confirm password</span>
            <input id="confirm" class="field mt-2" type="password" autocomplete="new-password" required />
            <span id="match-hint" class="mt-1 block text-xs text-brick" hidden>These do not match.</span>
          </label>

          <!-- Clerk's bot protection renders its challenge here when it decides
               one is needed. Custom sign-up flows must provide this element. -->
          <div id="clerk-captcha"></div>

          <button id="submit" class="btn-primary w-full" type="submit" disabled>Create account</button>
        </form>

        <p class="mt-6 text-sm text-muted">
          Already have an account?
          <a id="sign-in" class="underline" href="/account/sign-in">Sign in</a>
        </p>
      </section>

      <!-- After Google, Apple or Facebook, when Clerk still needs something the
           provider did not supply: an email (some Facebook accounts have none),
           a name, or agreement to the terms. -->
      <section id="continue-section" hidden>
        <p class="mt-2 text-sm text-muted">
          Almost done. We need a little more to finish your account.
        </p>
        <form id="continue-form" class="mt-6 space-y-4" novalidate>
          <label id="continue-email-field" class="block" hidden>
            <span class="text-sm font-medium">Email</span>
            <input id="continue-email" class="field mt-2" type="email" autocomplete="email" />
            <span class="mt-1 block text-xs text-muted">Your order updates and receipts go here.</span>
          </label>

          <label id="continue-name-field" class="block" hidden>
            <span class="text-sm font-medium">Name</span>
            <input id="continue-name" class="field mt-2" type="text" autocomplete="name" maxlength="160" />
          </label>

          <label id="continue-legal-field" class="flex items-start gap-3 text-sm" hidden>
            <input id="continue-legal" class="mt-1" type="checkbox" />
            <span>I agree to the Terms of Service and Privacy Policy.</span>
          </label>

          <button id="continue-submit" class="btn-primary w-full" type="submit">Continue</button>
        </form>
      </section>

      <section id="code-section" hidden>
        <p class="mt-4 text-[15px]">
          We sent a 6-digit code to <span id="sent-to" class="font-medium"></span>.
        </p>
        <form id="code-form" class="mt-6 space-y-4" novalidate>
          <label class="block">
            <span class="text-sm font-medium">Verification code</span>
            <input id="code" class="field mt-2 tracking-[0.3em]" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required />
          </label>
          <button id="code-submit" class="btn-primary w-full" type="submit">Create account</button>
        </form>
        <p class="mt-6 text-sm text-muted">
          Nothing arrived? Check spam, or
          <button id="resend" type="button" class="underline">send a new code</button>.
        </p>
      </section>
    </main>

    <script type="module" src="/login/customer-sign-up.ts"></script>
  </body>
</html>
