<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password</title>
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <!-- Runtime configuration (the Clerk publishable key), written by the web
         container at startup. A classic script, so it runs before the module
         entry below reads it. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <main class="mx-auto flex min-h-dvh max-w-sm flex-col justify-center px-5 py-10">
      <h1 class="font-display text-3xl">Reset your password</h1>

      <p id="error" class="mt-6 border-l-2 border-brick bg-brick/5 px-3 py-2 text-sm text-brick" hidden></p>

      <section id="email-section">
        <p class="mt-2 text-sm text-muted">
          Enter the email you order with and we&apos;ll send a 6-digit code to choose a new
          password.
        </p>

        <form id="email-form" class="mt-8 space-y-4" novalidate>
          <label class="block">
            <span class="text-sm font-medium">Email</span>
            <input id="email" class="field mt-2" type="email" autocomplete="email" required autofocus />
          </label>

          <button id="email-submit" class="btn-primary w-full" type="submit" disabled>Send code</button>
        </form>

        <p class="mt-6 text-sm text-muted">
          Remembered it? <a id="sign-in" class="underline" href="/account/sign-in">Sign in</a>
        </p>
      </section>

      <section id="reset-section" hidden>
        <p class="mt-4 text-[15px]">
          We sent a 6-digit code to <span id="sent-to" class="font-medium"></span>. Choosing a
          new password signs you in here.
        </p>

        <form id="reset-form" class="mt-6 space-y-4" novalidate>
          <label class="block">
            <span class="text-sm font-medium">Verification code</span>
            <input id="code" class="field mt-2 tracking-[0.3em]" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required />
          </label>

          <label class="block">
            <span class="text-sm font-medium">New password</span>
            <input id="password" class="field mt-2" type="password" autocomplete="new-password" required />
            <span id="length-hint" class="mt-1 block text-xs text-muted"></span>
          </label>

          <label class="block">
            <span class="text-sm font-medium">Confirm new password</span>
            <input id="confirm" class="field mt-2" type="password" autocomplete="new-password" required />
            <span id="match-hint" class="mt-1 block text-xs text-brick" hidden>These do not match.</span>
          </label>

          <button id="reset-submit" class="btn-primary w-full" type="submit" disabled>Set password</button>
        </form>

        <p class="mt-6 text-sm text-muted">
          Nothing arrived? Check spam, or
          <button id="resend" type="button" class="underline">send a new code</button>.
        </p>
      </section>
    </main>

    <script type="module" src="/login/customer-forgot-password.ts"></script>
  </body>
</html>
