services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zenoeats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zenoeats"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Celery broker. AOF persistence, noeviction. A lost task here means a
  # payment webhook goes unprocessed, so this instance never evicts.
  redis-broker:
    image: redis:7-alpine
    command: >
      redis-server --appendonly yes --maxmemory-policy noeviction
      --save 60 1000
    volumes:
      - redisbroker:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Cache and rate limiting. Eviction is fine here; nothing durable lives on
  # this instance. Separate process so cache pressure cannot starve the
  # broker (rule 23).
  redis-runtime:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis-broker: {condition: service_healthy}
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis-broker: {condition: service_healthy}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2

  beat:
    build: ./backend
    env_file: .env
    depends_on:
      redis-broker: {condition: service_healthy}
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info

  web:
    build: ./frontend
    env_file: .env
    environment:
      # Inside compose the API is reachable by service name. Natively it is
      # not, so next.config.js defaults to the published port instead.
      API_PROXY_ORIGIN: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:1.27-alpine
    # Pin the host gateway into /etc/hosts so nginx resolves it at startup
    # instead of per-request through Docker's embedded DNS, which answers
    # inconsistently and produced intermittent 502s.
    # The IP is spelled out rather than using the "host-gateway" keyword:
    # that keyword adds an IPv6 entry alongside the IPv4 one, and nginx tries
    # the unreachable IPv6 address first, logging an error and burning a round
    # trip before falling back. 192.168.65.254 is Docker Desktop's fixed host
    # gateway on Windows and macOS. On Linux use "zenoeats-host:host-gateway".
    extra_hosts:
      - "zenoeats-host:192.168.65.254"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisbroker:
