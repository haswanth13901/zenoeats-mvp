services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zenoeats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zenoeats"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Celery broker. AOF persistence, noeviction. A lost task here means a
  # payment webhook goes unprocessed, so this instance never evicts.
  redis-broker:
    image: redis:7-alpine
    command: >
      redis-server --appendonly yes --maxmemory-policy noeviction
      --save 60 1000
    volumes:
      - redisbroker:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Cache and rate limiting. Eviction is fine here; nothing durable lives on
  # this instance. Separate process so cache pressure cannot starve the
  # broker (rule 23).
  redis-runtime:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    # Behind a profile: `docker compose up -d` starts infrastructure only.
    # Building app images is what repeatedly wedged the Docker engine during
    # development, and nothing here needs rebuilding to run the app -- api,
    # worker, beat and web all run natively against these containers. Bring
    # them up only to rehearse production: docker compose --profile app up -d
    profiles: ["app"]
    env_file: .env
    environment:
      # env_file supplies host-side URLs; these override them with the
      # in-network equivalents. `environment:` wins over `env_file:`.
      DATABASE_URL_APP: ${DOCKER_DATABASE_URL_APP}
      DATABASE_URL_SYSTEM: ${DOCKER_DATABASE_URL_SYSTEM}
      DATABASE_URL_MIGRATE: ${DOCKER_DATABASE_URL_MIGRATE}
      CELERY_BROKER_URL: ${DOCKER_CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${DOCKER_CELERY_RESULT_BACKEND}
      REDIS_RUNTIME_URL: ${DOCKER_REDIS_RUNTIME_URL}
    depends_on:
      postgres: {condition: service_healthy}
      redis-broker: {condition: service_healthy}
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  worker:
    build: ./backend
    # Behind a profile: `docker compose up -d` starts infrastructure only.
    # Building app images is what repeatedly wedged the Docker engine during
    # development, and nothing here needs rebuilding to run the app -- api,
    # worker, beat and web all run natively against these containers. Bring
    # them up only to rehearse production: docker compose --profile app up -d
    profiles: ["app"]
    env_file: .env
    environment:
      # env_file supplies host-side URLs; these override them with the
      # in-network equivalents. `environment:` wins over `env_file:`.
      DATABASE_URL_APP: ${DOCKER_DATABASE_URL_APP}
      DATABASE_URL_SYSTEM: ${DOCKER_DATABASE_URL_SYSTEM}
      DATABASE_URL_MIGRATE: ${DOCKER_DATABASE_URL_MIGRATE}
      CELERY_BROKER_URL: ${DOCKER_CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${DOCKER_CELERY_RESULT_BACKEND}
      REDIS_RUNTIME_URL: ${DOCKER_REDIS_RUNTIME_URL}
    depends_on:
      postgres: {condition: service_healthy}
      redis-broker: {condition: service_healthy}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    # The image's HEALTHCHECK curls /health, which only the api serves. A
    # worker has no HTTP surface, so it reported unhealthy forever and any
    # orchestrator would restart it in a loop. Ask Celery instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  beat:
    build: ./backend
    # Behind a profile: `docker compose up -d` starts infrastructure only.
    # Building app images is what repeatedly wedged the Docker engine during
    # development, and nothing here needs rebuilding to run the app -- api,
    # worker, beat and web all run natively against these containers. Bring
    # them up only to rehearse production: docker compose --profile app up -d
    profiles: ["app"]
    env_file: .env
    environment:
      # env_file supplies host-side URLs; these override them with the
      # in-network equivalents. `environment:` wins over `env_file:`.
      DATABASE_URL_APP: ${DOCKER_DATABASE_URL_APP}
      DATABASE_URL_SYSTEM: ${DOCKER_DATABASE_URL_SYSTEM}
      DATABASE_URL_MIGRATE: ${DOCKER_DATABASE_URL_MIGRATE}
      CELERY_BROKER_URL: ${DOCKER_CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${DOCKER_CELERY_RESULT_BACKEND}
      REDIS_RUNTIME_URL: ${DOCKER_REDIS_RUNTIME_URL}
    depends_on:
      redis-broker: {condition: service_healthy}
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    # beat is a scheduler with no queryable liveness surface: `inspect ping`
    # answers from workers, not from beat. Rather than ship a check that
    # always fails, declare that there isn't one. Missed schedules surface as
    # stale PENDING_PAYMENT orders, which is what to alert on instead.
    healthcheck:
      disable: true

  web:
    # Behind a profile: `docker compose up -d` starts infrastructure only.
    # Building app images is what repeatedly wedged the Docker engine during
    # development, and nothing here needs rebuilding to run the app -- api,
    # worker, beat and web all run natively against these containers. Bring
    # them up only to rehearse production: docker compose --profile app up -d
    profiles: ["app"]
    build:
      context: ./frontend
      # NEXT_PUBLIC_* is inlined into the client bundle by `next build`, so
      # these must be present as build args. Supplying them only at runtime
      # leaves the bundle with no publishable key, and Clerk silently drops
      # into keyless mode and mints throwaway credentials.
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        # rewrites() is resolved by `next build` and baked into
        # routes-manifest.json, so this is a build arg, not runtime env.
        # Inside compose the API is reachable by service name; a native
        # `npm run dev` evaluates next.config.js itself and falls back to
        # the published port.
        API_PROXY_ORIGIN: http://api:8000
    env_file: .env
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:1.27-alpine
    # Pin the host gateway into /etc/hosts so nginx resolves it at startup
    # instead of per-request through Docker's embedded DNS, which answers
    # inconsistently and produced intermittent 502s.
    # The IP is spelled out rather than using the "host-gateway" keyword:
    # that keyword adds an IPv6 entry alongside the IPv4 one, and nginx tries
    # the unreachable IPv6 address first, logging an error and burning a round
    # trip before falling back. 192.168.65.254 is Docker Desktop's fixed host
    # gateway on Windows and macOS. On Linux use "zenoeats-host:host-gateway".
    extra_hosts:
      - "zenoeats-host:192.168.65.254"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    # No depends_on: proxy_pass targets zenoeats-host, the host gateway, not
    # these containers. nginx fronts whatever is listening on the host, which
    # in development is the native api and web processes.

volumes:
  pgdata:
  redisbroker:
