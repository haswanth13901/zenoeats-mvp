# Origin edge. In production this sits behind Cloudflare with the firewall
# allowlisting only the provider's proxy ranges (section 18.2), but the
# origin must work standalone for development and staging.

# Where the backends live. Change the proxy_pass lines below to switch modes:
#
#   API and web running natively on your host (local development):
#     zenoeats-host:8000  and  zenoeats-host:3000
#
#   Everything in Docker (docker compose up api web nginx):
#     api:8000            and  web:3000
#
# zenoeats-host is mapped to the host gateway by extra_hosts in
# docker-compose.yml, so it lands in this container's /etc/hosts and needs no
# DNS lookup at all. Two deliberate choices here, both learned the hard way:
#
#   * A literal name, not a variable. A variable upstream makes nginx
#     re-resolve on every single request through the `resolver` below, and
#     Docker's embedded DNS answers inconsistently -- intermittent SERVFAIL,
#     which nginx logs as "unexpected DNS response" and returns as a 502.
#
#   * zenoeats-host, not host.docker.internal. Docker Desktop publishes that
#     name dual-stacked, and nginx tries the IPv6 ULA first, fails with
#     "Network unreachable", and only then retries IPv4 -- an error log line
#     and a wasted round trip on every request. The custom alias is IPv4 only.

# $server_port is nginx's in-container listen port (80), not the port the
# browser actually connected to (8080, from the published mapping). Take the
# real one off the Host header instead.
map $http_host $client_port {
    default                 "80";
    "~^[^:]+:(?<port>\d+)$" $port;
}

map $http_host $restaurant_slug {
    default "";
    "~^(?<slug>[a-z0-9-]+)\.zenoeats\.local(:\d+)?$" $slug;
}

server {
    listen 80;
    server_name ~^.*\.zenoeats\.local$ zenoeats.local localhost;

    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://zenoeats-host:8000;
        # $http_host, not $host: $host drops the port, and the app builds
        # absolute URLs from what it receives here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $client_port;
        # The application resolves the tenant from Host. Passing it through
        # unmodified is what makes wildcard subdomains work. The slug header
        # is the fallback the API accepts when Host carries no subdomain.
        proxy_set_header X-Zenoeats-Restaurant $restaurant_slug;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://zenoeats-host:8000/health;
        access_log off;
    }

    location / {
        proxy_pass http://zenoeats-host:3000;
        # $http_host preserves ":8080". With $host the port is stripped, and
        # every absolute URL Next and Clerk generate points at port 80 --
        # including the __clerk_handshake redirect, which then lands on a
        # port nothing is listening on.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $client_port;

        # Next.js dev server uses websockets for hot reload. Without these
        # two headers every code change fails to push to the browser.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
