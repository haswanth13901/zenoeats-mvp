# Origin edge. In production this sits behind Cloudflare with the firewall
# allowlisting only the provider's proxy ranges (section 18.2), but the
# origin must work standalone for development and staging.

# Where the backends live. Change the proxy_pass lines below to switch modes:
#
#   API and web running natively on your host (local development):
#     zenoeats-host:8000  and  zenoeats-host:3000
#
#   Everything in Docker (docker compose up api web nginx):
#     api:8000            and  web:3000
#
# zenoeats-host is mapped to the host gateway by extra_hosts in
# docker-compose.yml, so it lands in this container's /etc/hosts and needs no
# DNS lookup at all. Two deliberate choices here, both learned the hard way:
#
#   * A literal name, not a variable. A variable upstream makes nginx
#     re-resolve on every single request through the `resolver` below, and
#     Docker's embedded DNS answers inconsistently -- intermittent SERVFAIL,
#     which nginx logs as "unexpected DNS response" and returns as a 502.
#
#   * zenoeats-host, not host.docker.internal. Docker Desktop publishes that
#     name dual-stacked, and nginx tries the IPv6 ULA first, fails with
#     "Network unreachable", and only then retries IPv4 -- an error log line
#     and a wasted round trip on every request. The custom alias is IPv4 only.

# $server_port is nginx's in-container listen port (80), not the port the
# browser actually connected to (8080, from the published mapping). Take the
# real one off the Host header instead.
map $http_host $client_port {
    default                 "80";
    "~^[^:]+:(?<port>\d+)$" $port;
}

# Only a real websocket handshake may carry Connection: upgrade. Sending it on
# every request -- which is what a hard-coded `Connection "upgrade"` does --
# tells the upstream each plain GET is a protocol switch, so the connection is
# neither reused nor cleanly closed. Against the Vite dev server that stalls
# module requests until the browser gives up on its six connections, and the
# page's own /api calls, queued behind them, time out.
#
# The ordinary case is an EMPTY value, not "close". Empty makes nginx omit the
# header, which is the only thing that lets it reuse a pooled upstream
# connection; "close" tells the upstream to hang up after every response, which
# silently made the `keepalive 64` in zenoeats_web below do nothing. A dev page
# load is hundreds of module requests, and each was paying its own TCP
# handshake. This is the same pair of headers /api/ already sets by hand.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

map $http_host $restaurant_slug {
    default "";
    "~^(?<slug>[a-z0-9-]+)\.zenoeats\.local(:\d+)?$" $slug;
}

# Named upstreams exist for one reason: `keepalive`. Without a block there is
# nothing to hold idle connections, so every request pays a fresh TCP handshake
# to the host gateway. The server name is still a literal, resolved once at
# startup, for the reasons in the comment above.
#
# keepalive_timeout here must stay BELOW the idle timeout of the server on the
# other end, and that ordering is the whole point of the directive. Whichever
# side closes second can pick a connection the other has already closed and
# send a request into it. The FIN is not always seen in time, so instead of a
# fast error the request sits there until proxy_read_timeout -- 30s below --
# and the browser's own 15s fetch timeout fires first. It surfaces as an
# intermittent "the server took too long to respond" on a request that takes
# 300ms when it is made directly, and it hits POSTs hardest because nginx will
# not retry a non-idempotent request it has already sent.
#
# uvicorn idles at 30s (--timeout-keep-alive in the Makefile) and the Vite dev
# server at Node's default 5s, so 3s here is clear of both.
upstream zenoeats_api {
    server zenoeats-host:8000;
    keepalive 32;
    keepalive_timeout 3s;
    keepalive_requests 1000;
}

upstream zenoeats_web {
    server zenoeats-host:3000;
    keepalive 64;
    keepalive_timeout 3s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name ~^.*\.zenoeats\.local$ zenoeats.local localhost;

    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://zenoeats_api;
        # Keepalive to the upstream needs HTTP/1.1 and an empty Connection
        # header; anything else closes the connection after every response.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host, not $host: $host drops the port, and the app builds
        # absolute URLs from what it receives here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended to: $proxy_add_x_forwarded_for would keep
        # whatever the client sent in front of the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $client_port;
        # The application resolves the tenant from Host. Passing it through
        # unmodified is what makes wildcard subdomains work. The slug header
        # is the fallback the API accepts when Host carries no subdomain.
        proxy_set_header X-Zenoeats-Restaurant $restaurant_slug;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://zenoeats_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Same rule as production: the platform portal is only served at
    # admin.zenoeats.local, so a hostname that would 404 at the API does not
    # first render a sign-in form here.
    location ^~ /admin {
        if ($host != admin.zenoeats.local) {
            return 404;
        }
        proxy_pass http://zenoeats_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://zenoeats_web;
        # $http_host preserves ":8080". With $host the port is stripped, and
        # every absolute URL the app and Clerk generate points at port 80 --
        # including the return from Google sign-in, which then lands on a
        # port nothing is listening on.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $client_port;

        # The dev server uses a websocket for hot reload. Without these two
        # headers every code change fails to push to the browser.
        # $connection_upgrade is "upgrade" only for an actual handshake and
        # empty otherwise, so an ordinary request is neither mistaken for a
        # protocol switch nor forced to close the connection it arrived on.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

