# The visitor's real address, when Zenoeats is proxied through Cloudflare.
#
# Behind Cloudflare every connection to the origin comes from a Cloudflare
# edge server, so without this $remote_addr is Cloudflare's address: every
# customer would share a handful of IPs and one busy restaurant could exhaust
# everyone's rate limit. These directives make nginx replace $remote_addr with
# CF-Connecting-IP -- but only on connections that really come from
# Cloudflare's ranges, so nobody else can set that header and be believed.
#
# Harmless when not behind Cloudflare: no connection matches the ranges, and
# $remote_addr stays the socket address.
#
# Cloudflare publishes these ranges at https://www.cloudflare.com/ips/ and
# changes them rarely. Re-check them before launch and when Cloudflare
# announces a change.

real_ip_header CF-Connecting-IP;

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
